<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>web-cli plugin</title>
    <style>
      :root { color-scheme: light dark; }
      *, *::before, *::after { box-sizing: border-box; }
      body { font: 13px/1.5 system-ui, sans-serif; margin: 0; padding: 8px; overflow-wrap: anywhere; }
      #status { font-weight: 600; padding: 4px 0; }
      .topbar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 2px 0 6px; }
      #llm-status { min-width: 0; }
      #llm-status.warn { color: #b45309; font-weight: 600; }
      #open-options.primary { font-weight: 600; }
      #llm-test { font-weight: 600; }
      #llm-test-result { margin: 2px 0 4px; }
      #llm-test-result.ok { color: #15803d; }
      #llm-test-result.warn { color: #b45309; font-weight: 600; }
      #site-hint {
        display: none; border: 1px solid #f59e0b; background: #fffbeb; color: #92400e;
        border-radius: 4px; padding: 6px 8px; margin: 4px 0;
      }
      #site-hint .sh-title { font-weight: 600; }
      #site-hint .sh-detail { margin: 3px 0; font-size: 12px; }
      #site-hint .sh-action { font-size: 12px; font-weight: 600; }
      #send-reason { margin-top: 4px; color: #b45309; }
      #onboarding {
        border: 1px solid #93c5fd; background: #eff6ff; border-radius: 4px;
        padding: 6px 8px; margin: 4px 0; display: none;
      }
      #onboarding ol { margin: 4px 0 0; padding-inline-start: 20px; }
      #onboarding li { margin: 2px 0; }
      #onboarding li.current { font-weight: 600; }
      #onboarding li.done { color: #64748b; }
      #notice { background: #fef3c7; color: #92400e; padding: 6px; border-radius: 4px; margin: 4px 0; display: none; }
      #env-guard {
        display: none; border: 2px solid #dc2626; background: #fef2f2; color: #991b1b;
        border-radius: 6px; padding: 8px; margin: 4px 0; font-weight: 600;
      }
      #discovery-notice { display: none; border: 1px solid #94a3b8; background: #f1f5f9; border-radius: 4px; padding: 6px 8px; margin: 4px 0; }
      #discovery-notice .dn-title { font-weight: 600; }
      #discovery-notice .dn-detail { margin: 4px 0; color: #475569; font-size: 12px; }
      #discovery-notice .dn-retry { display: none; }
      #log { height: 45vh; overflow: auto; border: 1px solid #cbd5e1; border-radius: 4px; padding: 6px; margin: 6px 0; white-space: pre-wrap; }
      /* F-5 / D-043: the empty-state centering must apply *only* when #log has no
         rendered entry elements. Gating on :not(:has(> *)) means a stale or
         out-of-sync `.empty` class (e.g. audit scripts injecting children
         directly) can no longer turn real entries into a horizontal flex row —
         non-empty logs always stay in normal block flow, one entry per line. */
      #log.empty:not(:has(> *)) {
        height: auto; min-height: 64px; display: flex; align-items: center; justify-content: center;
        text-align: center; color: #64748b; background: #f8fafc;
      }
      .entry-error { color: #dc2626; }
      .entry-tool { color: #475569; }
      #confirm { border: 1px solid #f59e0b; background: #fffbeb; border-radius: 4px; padding: 6px; margin: 6px 0; display: none; }
      #confirm-summary, #ask-prompt { overflow-wrap: anywhere; }
      #ask { border: 1px solid #38bdf8; background: #f0f9ff; border-radius: 4px; padding: 6px; margin: 6px 0; display: none; }
      .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
      #composer { display: flex; gap: 6px; margin-top: 6px; }
      #input { flex: 1; min-width: 0; }
      #send { flex: 0 0 auto; }
      #consent { border-top: 1px solid #cbd5e1; margin-top: 10px; padding-top: 6px; }
      #consent details { min-width: 0; }
      #consent summary { cursor: pointer; font-weight: 600; }
      #consent h3 { font-size: 13px; margin: 8px 0 2px; }
      #consent ul { margin: 2px 0; padding-inline-start: 20px; }
      #consent li { margin: 2px 0; }
      .muted { color: #64748b; font-size: 12px; }
      /* ── TASK-022: message blocks + safe Markdown ───────────────────────── */
      /* One grouped block per message: role label + body, distinguished by a
         left colour bar. `.entry-*` classes are kept for existing selectors. */
      .msg {
        margin: 8px 0; min-width: 0; border-radius: 4px;
        border-left: 3px solid #cbd5e1; background: #f8fafc;
      }
      .msg:first-child { margin-top: 0; }
      .msg:last-child { margin-bottom: 0; }
      .msg-role { padding: 2px 8px; font-size: 11px; color: #64748b; background: rgba(148, 163, 184, 0.12); }
      .msg-content { padding: 4px 8px; min-width: 0; overflow-wrap: anywhere; }
      .content-user { white-space: pre-wrap; }
      /* Assistant bodies are Markdown; reset the container's pre-wrap so block
         elements and inline text flow normally (GFM tables/lists/pre handle
         their own whitespace). */
      .content-assistant { white-space: normal; }
      /* Tool/system output is raw CLI/document text: keep whitespace + tabs. */
      .content-tool, .content-system {
        white-space: pre-wrap; font-size: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      }
      .msg-user { border-left-color: #38bdf8; }
      .msg-assistant { border-left-color: #818cf8; }
      .msg-tool { border-left-color: #94a3b8; }
      .msg-system { border-left-color: #f59e0b; }
      .entry-error .msg-role { color: #b91c1c; }
      /* Markdown blocks: tighten margins and never let content widen the panel. */
      .msg-content > :first-child { margin-top: 0; }
      .msg-content > :last-child { margin-bottom: 0; }
      .msg-content h1, .msg-content h2, .msg-content h3,
      .msg-content h4, .msg-content h5, .msg-content h6 { margin: 6px 0 3px; line-height: 1.3; }
      .msg-content h1 { font-size: 16px; }
      .msg-content h2 { font-size: 15px; }
      .msg-content h3, .msg-content h4, .msg-content h5, .msg-content h6 { font-size: 14px; }
      .msg-content p { margin: 4px 0; }
      .msg-content ul, .msg-content ol { margin: 4px 0; padding-inline-start: 20px; }
      .msg-content li { margin: 1px 0; }
      .msg-content blockquote {
        margin: 4px 0; padding: 2px 8px; color: #475569;
        border-left: 3px solid #cbd5e1; background: rgba(148, 163, 184, 0.08);
      }
      .msg-content hr { border: 0; border-top: 1px solid #cbd5e1; margin: 6px 0; }
      .msg-content code {
        padding: 1px 4px; border-radius: 3px; font-size: 12px;
        background: rgba(100, 116, 139, 0.14);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      }
      /* Code blocks + tables scroll inside their own box, never the panel. */
      .msg-content pre {
        margin: 4px 0; padding: 6px 8px; border-radius: 4px;
        background: #0f172a; color: #e2e8f0;
        max-width: 100%; overflow-x: auto;
      }
      .msg-content pre code { padding: 0; background: none; color: inherit; }
      .msg-content table {
        display: block; width: max-content; max-width: 100%;
        margin: 4px 0; overflow-x: auto; border-collapse: collapse;
      }
      .msg-content th, .msg-content td { border: 1px solid #cbd5e1; padding: 2px 6px; text-align: left; }
      .msg-content thead th { background: rgba(148, 163, 184, 0.14); }
      .msg-content a { color: #2563eb; }
    </style>
  </head>
  <body>
    <div id="env-guard" role="alert"></div>
    <div id="status">无活跃站点</div>
    <div class="topbar" id="topbar">
      <button id="open-options" type="button">配置模型 / 设置</button>
      <span id="llm-status" class="muted">LLM：检测中…</span>
      <button id="llm-test" type="button">测试连接</button>
    </div>
    <div id="llm-test-result" class="muted" role="status" aria-live="polite"></div>
    <div id="site-hint" role="status" aria-live="polite">
      <div class="sh-title" id="site-hint-title"></div>
      <div class="sh-detail" id="site-hint-detail"></div>
      <div class="sh-action" id="site-hint-action"></div>
    </div>
    <div id="onboarding"></div>
    <div id="discovery-notice" role="status" aria-live="polite">
      <div class="dn-title" id="discovery-title"></div>
      <div class="dn-detail" id="discovery-detail"></div>
      <button id="discovery-retry" class="dn-retry" type="button">重新探测</button>
    </div>
    <div id="notice"></div>
    <div class="row">
      <button id="authorize" type="button">授权当前站点</button>
      <button id="revoke" type="button">撤销授权</button>
      <button id="rebind" type="button">重新绑定当前标签页</button>
      <button id="audit" type="button">查看审计</button>
      <span id="audit-count" class="muted">审计 0 条</span>
    </div>
    <div id="log" aria-label="会话记录"></div>
    <div id="confirm">
      <div>敏感操作需二次确认：</div>
      <div id="confirm-summary"></div>
      <div class="row">
        <button id="confirm-allow" type="button">允许</button>
        <button id="confirm-deny" type="button">拒绝</button>
        <span class="muted">超时/取消 = 拒绝</span>
      </div>
    </div>
    <div id="ask">
      <div class="muted">AI 任务内澄清提问（与权限确认不同）：</div>
      <div id="ask-prompt"></div>
      <div id="ask-options" class="row"></div>
      <div class="row">
        <input id="ask-input" type="text" placeholder="输入回答…" autocomplete="off" />
        <button id="ask-submit" type="button">回答</button>
        <button id="ask-cancel" type="button">取消</button>
      </div>
      <span class="muted">取消 = 回答被取消（不代填默认值）</span>
    </div>
    <form id="composer">
      <input id="input" type="text" placeholder="输入指令…" autocomplete="off" />
      <button id="send" type="submit">发送</button>
    </form>
    <div id="send-reason" class="muted" role="status" aria-live="polite"></div>
    <script src="sidepanel.js"></script>
  </body>
</html>
