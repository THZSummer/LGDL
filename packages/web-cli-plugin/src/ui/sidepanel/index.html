<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>web-cli plugin</title>
    <style>
      :root { color-scheme: light dark; }
      *, *::before, *::after { box-sizing: border-box; }
      body { font: 13px/1.5 system-ui, sans-serif; margin: 0; padding: 8px; overflow-wrap: anywhere; }
      #status { font-weight: 600; padding: 4px 0; }
      .topbar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 2px 0 6px; }
      #llm-status { min-width: 0; }
      #llm-status.warn { color: #b45309; font-weight: 600; }
      #open-options.primary { font-weight: 600; }
      #onboarding {
        border: 1px solid #93c5fd; background: #eff6ff; border-radius: 4px;
        padding: 6px 8px; margin: 4px 0; display: none;
      }
      #onboarding ol { margin: 4px 0 0; padding-inline-start: 20px; }
      #onboarding li { margin: 2px 0; }
      #onboarding li.current { font-weight: 600; }
      #onboarding li.done { color: #64748b; }
      #notice { background: #fef3c7; color: #92400e; padding: 6px; border-radius: 4px; margin: 4px 0; display: none; }
      #log { height: 45vh; overflow: auto; border: 1px solid #cbd5e1; border-radius: 4px; padding: 6px; margin: 6px 0; white-space: pre-wrap; }
      /* F-5 / D-043: the empty-state centering must apply *only* when #log has no
         rendered entry elements. Gating on :not(:has(> *)) means a stale or
         out-of-sync `.empty` class (e.g. audit scripts injecting children
         directly) can no longer turn real entries into a horizontal flex row —
         non-empty logs always stay in normal block flow, one entry per line. */
      #log.empty:not(:has(> *)) {
        height: auto; min-height: 64px; display: flex; align-items: center; justify-content: center;
        text-align: center; color: #64748b; background: #f8fafc;
      }
      .entry-error { color: #dc2626; }
      .entry-tool { color: #475569; }
      #confirm { border: 1px solid #f59e0b; background: #fffbeb; border-radius: 4px; padding: 6px; margin: 6px 0; display: none; }
      #confirm-summary, #ask-prompt { overflow-wrap: anywhere; }
      #ask { border: 1px solid #38bdf8; background: #f0f9ff; border-radius: 4px; padding: 6px; margin: 6px 0; display: none; }
      .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
      #composer { display: flex; gap: 6px; margin-top: 6px; }
      #input { flex: 1; min-width: 0; }
      #send { flex: 0 0 auto; }
      #consent { border-top: 1px solid #cbd5e1; margin-top: 10px; padding-top: 6px; }
      #consent details { min-width: 0; }
      #consent summary { cursor: pointer; font-weight: 600; }
      #consent h3 { font-size: 13px; margin: 8px 0 2px; }
      #consent ul { margin: 2px 0; padding-inline-start: 20px; }
      #consent li { margin: 2px 0; }
      .muted { color: #64748b; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="status">无活跃站点</div>
    <div class="topbar" id="topbar">
      <button id="open-options" type="button">配置模型 / 设置</button>
      <span id="llm-status" class="muted">LLM：检测中…</span>
    </div>
    <div id="onboarding"></div>
    <div id="notice"></div>
    <div class="row">
      <button id="authorize" type="button">授权当前站点</button>
      <button id="revoke" type="button">撤销授权</button>
      <button id="audit" type="button">查看审计</button>
      <span id="audit-count" class="muted">审计 0 条</span>
    </div>
    <div id="log" aria-label="会话记录"></div>
    <div id="confirm">
      <div>敏感操作需二次确认：</div>
      <div id="confirm-summary"></div>
      <div class="row">
        <button id="confirm-allow" type="button">允许</button>
        <button id="confirm-deny" type="button">拒绝</button>
        <span class="muted">超时/取消 = 拒绝</span>
      </div>
    </div>
    <div id="ask">
      <div class="muted">AI 任务内澄清提问（与权限确认不同）：</div>
      <div id="ask-prompt"></div>
      <div id="ask-options" class="row"></div>
      <div class="row">
        <input id="ask-input" type="text" placeholder="输入回答…" autocomplete="off" />
        <button id="ask-submit" type="button">回答</button>
        <button id="ask-cancel" type="button">取消</button>
      </div>
      <span class="muted">取消 = 回答被取消（不代填默认值）</span>
    </div>
    <form id="composer">
      <input id="input" type="text" placeholder="输入指令…" autocomplete="off" />
      <button id="send" type="submit">发送</button>
    </form>
    <script src="sidepanel.js"></script>
  </body>
</html>
