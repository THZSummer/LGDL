name: Deploy Web Workbench to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'packages/lgdl-web/**'
      - 'packages/lgdl-core/**'
      - 'packages/lgdl-layout/**'
      - 'packages/lgdl-render/**'
      - 'packages/lgdl-web-cli/**'
      - 'packages/lgdl-web-op-cli/**'
      - 'packages/web-cli-base/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build core, layout, render, web-cli-base, lgdl-web-cli, lgdl-web-op-cli packages
        run: npm run build --workspace @lgdl/lgdl-core --workspace @lgdl/lgdl-layout --workspace @lgdl/lgdl-render --workspace @lgdl/web-cli-base --workspace @lgdl/lgdl-web-cli --workspace @lgdl/lgdl-web-op-cli

      - name: Build web workbench (Pages base path)
        run: npm run build --workspace @lgdl/lgdl-web
        env:
          GH_PAGES: 'true'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/lgdl-web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
